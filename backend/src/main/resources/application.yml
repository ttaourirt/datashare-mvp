spring:
  application:
    name: datashare-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/datashare
    username: datashare
    password: datashare

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway pilote le schéma, JPA ne fait que valider
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB

server:
  port: 8080
  error:
    include-message: always

# --- Config custom ---
datashare:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-please-use-a-32-plus-char-secret-key}
    expiration-hours: 24
  storage:
    root: ${STORAGE_ROOT:./storage/uploads}
  cors:
    allowed-origins: http://localhost:4200

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
  metrics:
    distribution:
      percentiles:
        http.server.requests: 0.5,0.95,0.99
        datashare.upload.size: 0.5,0.95

springdoc:
  swagger-ui:
    path: /swagger-ui.html
