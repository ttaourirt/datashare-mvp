# Intégration continue : à chaque push sur main et à chaque pull request,
# on compile et on lance les tests du back-end et du front-end.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Back-end (tests unitaires + intégration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Les tests d'intégration démarrent un PostgreSQL avec Testcontainers (Docker est fourni par GitHub)
      - name: Tests et couverture JaCoCo
        run: ./mvnw -B verify

  frontend:
    name: Front-end (tests unitaires + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CYPRESS_INSTALL_BINARY: 0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Tests unitaires (Vitest)
        run: npm test -- --watch=false
      - name: Build de production (vérifie aussi le budget du bundle)
        run: npx ng build
