services:
  postgres:
    image: postgres:16-alpine
    container_name: datashare-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: datashare
      POSTGRES_USER: datashare
      POSTGRES_PASSWORD: datashare
    ports:
      - "5432:5432"
    volumes:
      - datashare-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datashare"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  datashare-db-data:
