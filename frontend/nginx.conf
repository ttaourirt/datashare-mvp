server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Fichiers jusqu'à 1 Go (+ une marge pour l'enveloppe multipart)
    client_max_body_size 1100m;

    # Les appels à l'API sont relayés vers le back-end Spring Boot
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Envoi direct au back-end, sans copie temporaire du fichier sur le disque de Nginx
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # Application Angular : toutes les routes (/login, /d/<lien>...) renvoient index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
